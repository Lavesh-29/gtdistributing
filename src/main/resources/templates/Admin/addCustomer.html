<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GT Distributing - Add Customer</title>

    <style>
        /* General Reset */
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        html, body {
          height: 100%;
          font-family: Arial, sans-serif;
          background-color: #f0f0f0;
        }

        /* Flex container to stick footer to bottom */
        body {
          display: flex;
          flex-direction: column;
        }

        main {
          flex: 1;
        }

        /* Header Styles */
        header {
          width: 100%;
          padding: 6px 10px;
          background-color: #222;
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
        }

        .logo {
          display: flex;
          align-items: center;
        }

        .logo img {
          width: 90px;
          height: auto;
        }

        .text-container {
          margin-left: 10px;
        }

        .company-name, .white-text {
          color: white;
        }

        /* Navigation Menu */
        nav ul {
          display: flex;
          list-style: none;
          flex-wrap: wrap;
        }

        nav ul li {
          margin: 5px 10px;
        }

        nav ul li a {
          color: #fff;
          text-decoration: none;
          padding: 5px 10px;
          font-weight: 500;
        }

        nav ul li a:hover {
          background-color: lightgrey;
          color: #000;
        }

        .container {
          padding: 20px;
        }

        .form-container {
          margin-top: 20px;
        }

        .form-group {
          margin-bottom: 15px;
        }

        .form-group label {
          display: block;
          font-weight: bold;
          margin-bottom: 5px;
        }

        .form-group input {
          width: 100%;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
        }

        .form-row {
          display: flex;
          flex-wrap: wrap;
          gap: 15px;
        }

        .form-row .form-group {
          flex: 1;
          min-width: 200px;
        }

        /* Buttons */
        .btn {
          display: inline-block;
          margin-top: 10px;
          padding: 8px 16px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          text-decoration: none;
          color: #fff;
        }

        .btn-primary {
          background-color: #007bff;
        }

        .btn-secondary {
          background-color: #6c757d;
          margin-left: 10px;
        }

        /* Footer */
        footer {
          background-color: #000;
          color: #fff;
          padding: 20px;
          text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="/public/images/image.png" alt="Logo">
        <div class="text-container">
            <div class="company-name" style="font-size: 24px; font-weight: bold;">GT Distributing</div>
            <span class="white-text">385 SW 60th Ave<br>Ocala, Florida 34474</span>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="/index">Home</a></li>
            <li><a href="/Promotion">Promotion</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/OrderForm">Order Form</a></li>
            <li><a href="/order">Order</a></li>
            <li><a href="/registration">Registration</a></li>
            <li><a href="/return">About Us/ Policy</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="container">
        <h1 style="text-align: center; width: 100%;">Add New Customer</h1>
        <div class="form-container">
            <form th:action="@{/customers/add}" th:method="post" th:object="${customer}">
                <div class="form-group">
                    <label for="custNo" >Customer Number</label>
                    <input type="number" id="custNo" th:field="*{custNo}" required>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label for="name2">Name 2</label>
                    <input type="text" id="name2" th:field="*{name2}">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" required>
                </div>
                <div class="form-group">
                    <label for="address2">Address 2</label>
                    <input type="text" id="address2" th:field="*{address2}">
                </div>

                <!-- Group city, state, county, and zip on the same line -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" th:field="*{city}" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State</label>
                        <input type="text" id="state" th:field="*{state}">
                    </div>
                    <div class="form-group">
                        <label for="county">County</label>
                        <input type="text" id="county" th:field="*{county}">
                    </div>
                    <div class="form-group">
                        <label for="zip">Zip Code</label>
                        <input type="text" id="zip" th:field="*{zip}">
                    </div>
                </div>

                <!-- Group phone and alternate phone on the same line -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" id="phone" th:field="*{phone}">
                    </div>
                    <div class="form-group">
                        <label for="altPhone">Alternate Phone</label>
                        <input type="text" id="altPhone" th:field="*{altPhone}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Customer</button>
                <a th:href="@{/customers/list}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2025 GTDISTRIBUTING.COM. All rights reserved.</p>
    <p>Phone: 352-873-0400 &nbsp; ** &nbsp; Fax: 352-342-9022</p>
</footer>

</body>
</html>
