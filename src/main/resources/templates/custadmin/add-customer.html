<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - GT Distributing</title>
    <link rel="stylesheet" href="/css/styles.css" type="text/css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header, footer {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .logo img {
            width: 50px;
            vertical-align: middle;
        }

        .logo .company-name {
            font-size: 24px;
            font-weight: bold;
        }

        .logo .white-text {
            font-size: 14px;
            margin-top: 5px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #007bff;
        }

        .container {
            display: flex;
            justify-content: center;
            padding: 20px;
            flex-grow: 1;
            background-color: #fff;
        }

        .form-container {
            width: 100%;
            max-width: 900px;
            background-color: #fafafa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row label {
            font-weight: bold;
            text-align: left;
            margin-bottom: 5px;
        }

        .form-row input, .form-row textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-row input[type="number"] {
            -moz-appearance: textfield;
        }

        .form-buttons {
            text-align: center;
            margin-top: 20px;
        }

        .form-buttons button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-buttons button:hover {
            background-color: #0056b3;
        }

        footer p {
            margin: 10px 0;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="/public/images/image.png" alt="Logo">
        <div class="text-container">
            <div class="company-name">GT Distributing</div>
            <span class="white-text">385 SW 60th Ave<br>Ocala, Florida 34474</span>
        </div>
    </div>
    <nav>
        <ul>
            <li><a href="/index">Home</a></li>
            <li><a href="/Promotion">Promotion</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/OrderForm">Order Form</a></li>
            <li><a href="/order">Order</a></li>
            <li><a href="/registration">Registration</a></li>
            <li><a href="/return">About Us/ Policy</a></li>
        </ul>
    </nav>
</header>

<div class="container">
    <div class="form-container">
        <form th:action="@{/customers/add}" th:object="${customer}" method="post">
            <div class="form-row">
                <div>
                    <label for="custNo">Customer No:</label>
                    <input type="number" id="custNo" th:field="*{custNo}" required/>
                </div>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" th:field="*{name}" required/>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="name2">Name 2:</label>
                    <input type="text" id="name2" th:field="*{name2}"/>
                </div>
                <div>
                    <label for="address">Address:</label>
                    <input type="text" id="address" th:field="*{address}" required/>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="address2">Address 2:</label>
                    <input type="text" id="address2" th:field="*{address2}"/>
                </div>
                <div>
                    <label for="city">City:</label>
                    <input type="text" id="city" th:field="*{city}" required/>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="state">State:</label>
                    <input type="text" id="state" th:field="*{state}" required/>
                </div>
                <div>
                    <label for="county">County:</label>
                    <input type="text" id="county" th:field="*{county}" required/>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="zip">ZIP:</label>
                    <input type="text" id="zip" th:field="*{zip}" required/>
                </div>
                <div>
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" th:field="*{phone}" required/>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="altPhone">Alternative Phone:</label>
                    <input type="text" id="altPhone" th:field="*{altPhone}"/>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" th:field="*{password}"/>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit">Save Customer</button>
                <button type="button" onclick="window.location.href='/add-customer.html'">Cancel</button>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2025 GT Distributing. All rights reserved.</p>
</footer>

<script>

</script>

</body>
</html>
